# Build, test and package monoSettlers for Linux, Windows and macOS.
#
# - Every push to main and every pull request: build and tests; the packages are kept as workflow artifacts.
# - The determinism check: the same AI game on Linux, Windows and macOS (ARM) must give the same checksums (lockstep).
# - A tag vX.Y.Z (docs/VERSIONING.md): the same, plus a GitHub release with both packages
#   (a pre-release when the version has a suffix, e.g. v0.3.0-beta.1).
#
# The version comes from the git tags (MinVer, see Directory.Build.props), so the checkout needs the full history.
# The packages hold no original assets: the game asks for an installation of The Settlers III on the first start.
# macOS: an app bundle, ad-hoc signed only (no Apple developer account): Gatekeeper blocks it until the quarantine
# flag is removed (README). Nobody has tried it on a Mac yet.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build Homestead.sln -c Release
      # Tests with the original maps pass unchecked without an installation.
      - name: Test
        run: dotnet test Homestead.sln -c Release --no-build

  # Lockstep multiplayer needs every machine to simulate exactly alike: the same AI game on Linux and Windows (x64)
  # and macOS (ARM) must give the same checksum after every game minute (DeterminismTests).
  determinism:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Checksums
        shell: bash
        env:
          HOMESTEAD_CHECKSUM_FILE: ${{ github.workspace }}/checksums-${{ matrix.os }}.txt
        run: dotnet test tests/Homestead.Simulation.Tests -c Release --filter "FullyQualifiedName~DeterminismTests"
      - uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.os }}
          path: checksums-${{ matrix.os }}.txt
          if-no-files-found: error
          retention-days: 7

  determinism-compare:
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          merge-multiple: true
      - name: Compare
        run: |
          # Line endings apart (should one platform write "\r\n").
          sed -i 's/\r$//' checksums-*.txt
          for file in checksums-*.txt; do echo "$file: $(tail -n 1 "$file")"; done
          for file in checksums-*.txt; do
            if ! diff -q checksums-ubuntu-latest.txt "$file" > /dev/null; then
              echo "::error::$file differs from Linux, first at minute $(diff checksums-ubuntu-latest.txt "$file" | grep -m1 '^>' | cut -d' ' -f2)"
              exit 1
            fi
          done
          echo "All platforms simulate alike."

  package:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: win-x64
            os: ubuntu-latest
            archive: zip
          - rid: osx-arm64
            os: macos-latest
            archive: zip
          - rid: osx-x64
            os: macos-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Version
        id: version
        run: echo "version=$(dotnet msbuild src/Homestead.Client/Homestead.Client.csproj -restore -t:MinVer -getProperty:MinVerVersion -p:Configuration=Release)" >> "$GITHUB_OUTPUT"
      - name: Publish
        run: >
          dotnet publish src/Homestead.Client/Homestead.Client.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -o "publish/monoSettlers-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
      - name: Package
        id: package
        working-directory: publish
        run: |
          version="${{ steps.version.outputs.version }}"
          name="monoSettlers-$version-${{ matrix.rid }}"
          case "${{ matrix.rid }}" in
          osx-*)
            # monoSettlers.app with the published folder as Contents/MacOS (the program finds data/ next to itself).
            app="monoSettlers.app"
            mkdir -p "$app/Contents/Resources"
            mv "$name" "$app/Contents/MacOS"
            # macOS wants plain numbers: without a pre-release suffix.
            sed "s/VERSION/${version%%-*}/g" ../packaging/macos/Info.plist > "$app/Contents/Info.plist"
            mkdir icon.iconset
            sips -s format png ../src/Homestead.Client/Icon.bmp --out icon.iconset/icon_256x256.png
            iconutil -c icns icon.iconset -o "$app/Contents/Resources/monoSettlers.icns"
            codesign --force --deep --sign - "$app" || echo "::warning::ad-hoc signing failed"
            mkdir "$name"
            mv "$app" "$name/"
            cp ../LICENSE.md ../THIRD_PARTY_NOTICES.md ../README.md "$name/"
            # ditto keeps the bundle's attributes and signature, unlike zip.
            ditto -c -k --keepParent "$name" "$name.zip"
            ;;
          win-*)
            cp ../LICENSE.md ../THIRD_PARTY_NOTICES.md ../README.md "$name/"
            zip -qr "$name.zip" "$name"
            ;;
          *)
            cp ../LICENSE.md ../THIRD_PARTY_NOTICES.md ../README.md "$name/"
            tar -czf "$name.tar.gz" "$name"
            ;;
          esac
          echo "file=publish/$name.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --title "monoSettlers $TAG" --generate-notes $prerelease
